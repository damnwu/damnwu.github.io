name: Auto Update Steam Activity

on:
  schedule:
    # Запуск каждые 6 часов
    - cron: '0 */6 * * *'
  workflow_dispatch: # Возможность запустить вручную кнопкой в GitHub Actions

jobs:
  update-steam-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Live Steam Data
        run: |
          python3 -c "
          import urllib.request, json, os

          api_key = os.environ.get('STEAM_API_KEY', '')
          steam_id = '76561199488101705'

          if not api_key:
              print('STEAM_API_KEY не задан в Secrets. Пропуск обновления.')
              exit(0)

          url = f'https://api.steampowered.com/IPlayerService/GetRecentlyPlayedGames/v0001/?key={api_key}&steamid={steam_id}&format=json'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
                  response_data = data.get('response', {})
                  if 'games' in response_data:
                      with open('steam-data.json', 'w', encoding='utf-8') as f:
                          json.dump(response_data, f, indent=2)
                      print('steam-data.json успешно обновлен!')
          except Exception as e:
              print(f'Ошибка запроса к Steam API: {e}')
          "
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add steam-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Steam activity [skip ci]" && git push)
