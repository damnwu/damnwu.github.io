name: Auto Update Steam & Socials Activity

on:
  schedule:
    # Запуск каждые 6 часов
    - cron: '0 */6 * * *'
  workflow_dispatch: # Возможность запустить вручную кнопкой в GitHub Actions

# Разрешение для github-actions[bot] на запись (push) в репозиторий
permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Live Telegram & Discord Data
        run: |
          python3 -c "
          import urllib.request, json, os, re

          profiles = {}
          if os.path.exists('profiles.json'):
              try:
                  with open('profiles.json', 'r', encoding='utf-8') as f:
                      profiles = json.load(f)
              except:
                  pass

          # 1. Scrape Telegram profile (t.me/damnwu0)
          try:
              req = urllib.request.Request('https://t.me/damnwu0', headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=10) as resp:
                  html = resp.read().decode('utf-8', errors='ignore')

                  title_match = re.search(r'<meta property=\"og:title\" content=\"([^\"]+)\">', html)
                  image_match = re.search(r'<meta property=\"og:image\" content=\"([^\"]+)\">', html)
                  desc_match = re.search(r'<div class=\"tgme_page_description\"[^>]*>(.*?)</div>', html, re.DOTALL)

                  if 'telegram' not in profiles:
                      profiles['telegram'] = {}

                  if title_match:
                      profiles['telegram']['name'] = title_match.group(1).strip()
                  if image_match:
                      profiles['telegram']['avatar'] = image_match.group(1).strip()
                  if desc_match:
                      clean_desc = re.sub(r'<[^>]+>', '', desc_match.group(1)).strip()
                      if clean_desc:
                          profiles['telegram']['bio'] = clean_desc
          except Exception as e:
              print(f'Telegram update error: {e}')

          # 2. Check Lanyard for Discord KV & bio/banner
          try:
              req = urllib.request.Request('https://api.lanyard.rest/v1/users/896804605151805521', headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=10) as resp:
                  data = json.loads(resp.read().decode('utf-8')).get('data', {})
                  if 'discord' not in profiles:
                      profiles['discord'] = {}

                  kv = data.get('kv', {})
                  if kv.get('bio'):
                      profiles['discord']['bio'] = kv['bio']
                  if kv.get('banner'):
                      profiles['discord']['banner'] = kv['banner']
          except Exception as e:
              print(f'Discord update error: {e}')

          with open('profiles.json', 'w', encoding='utf-8') as f:
              json.dump(profiles, f, indent=2, ensure_ascii=False)
          print('profiles.json успешно синхронизирован!')
          "

      - name: Fetch Live Steam Data
        run: |
          python3 -c "
          import urllib.request, json, os

          api_key = os.environ.get('STEAM_API_KEY', '')
          steam_id = '76561199488101705'

          if not api_key:
              print('STEAM_API_KEY не задан в Secrets. Пропуск обновления Steam.')
              exit(0)

          url = f'https://api.steampowered.com/IPlayerService/GetRecentlyPlayedGames/v0001/?key={api_key}&steamid={steam_id}&format=json'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
                  response_data = data.get('response', {})
                  if 'games' in response_data:
                      with open('steam-data.json', 'w', encoding='utf-8') as f:
                          json.dump(response_data, f, indent=2)
                      print('steam-data.json успешно обновлен!')
          except Exception as e:
              print(f'Ошибка запроса к Steam API: {e}')
          "
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add steam-data.json profiles.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update Steam and profiles data [skip ci]"
            git push origin main
          else
            echo "Нет изменений для коммита."
          fi
